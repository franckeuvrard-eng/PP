name: petitpas
description: Application iOS de suivi d'activités petite enfance et maternelle avec scan QR Code, prise de photo et paramétrage 100% UI.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
