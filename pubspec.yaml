name: petitpas
description: Application iOS de suivi d'activités petite enfance et maternelle avec scan QR Code, prise de photo et paramétrage 100% UI.

publish_to: 'none'

version: 1.3.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0
  image_picker: ^1.0.7
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  pdf: ^3.10.8
  printing: ^5.11.1
  path_provider: ^2.1.2
  archive: ^3.4.10
  share_plus: ^9.0.0
  file_picker: ^8.0.0
  excel: ^4.0.4
  local_auth: ^2.2.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  ios: true
  image_path: "assets/images/app_icon.jpg"
  remove_alpha_channel_ios: true
  background_color_ios: "#4E9F3D"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
