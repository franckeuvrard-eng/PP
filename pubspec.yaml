name: petitpas
description: Application iOS de suivi d'activités petite enfance et maternelle avec scan QR Code, prise de photo et paramétrage 100% UI.
# Flutter version: 3.47.7 - Mon Suivi Maternelle
publish_to: 'none'

version: 1.7.0+11

environment:
  sdk: '>=3.0.0 <4.0.0'

# La reproductibilite est assuree par pubspec.lock (versionne), pas par des
# versions exactes ici : le CI est epingle sur Flutter 3.47.7 et c'est le
# lockfile qui fige la resolution exacte de tout l'arbre de dependances.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  image_picker: ^1.0.7
  intl: ^0.20.3
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  pdf: ^3.10.8
  printing: ^5.11.1
  path_provider: ^2.1.2
  archive: ^3.4.10
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  excel: ^4.0.4
  local_auth: ^3.0.2
  sqflite: ^2.3.3
  path: ^1.9.0
  # sqflite ne cible que iOS et Android : l'implementation FFI permet de
  # continuer a previsualiser l'application sur poste de travail.
  sqflite_common_ffi: ^2.4.4
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  record: ^7.1.2
  audioplayers: ^6.1.0
  # Decouverte automatique des appareils sur le Wi-Fi (Bonjour / mDNS).
  # 5.x : la 7.x change l API des evenements de decouverte (migration a part).
  bonsoir: ^7.1.5
  # Conteneur iCloud Drive prive (iOS/macOS), code natif dans le depot.
  petitpas_icloud:
    path: packages/petitpas_icloud
  pasteboard: ^0.6.0
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Generation de l'icone macOS arrondie (tool/make_macos_icon.dart).
flutter_launcher_icons:
  ios: true
  image_path: "assets/images/app_icon.jpg"
  remove_alpha_channel_ios: true
  background_color_ios: "#4E9F3D"
  windows:
    generate: true
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/images/
