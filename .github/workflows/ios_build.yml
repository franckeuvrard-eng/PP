name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Recreate iOS platform files
        run: |
          mv ios/Runner/Info.plist Info.plist.bak
          flutter create --project-name=petitpas --platforms=ios .
          mv Info.plist.bak ios/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r PetitPas_v1.1.0.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetitPas-iOS-IPA
          path: PetitPas_v1.1.0.ipa
