name: Build iOS IPA

on:
  workflow_dispatch:
  workflow_call:

env:
  # Minimum de Flutter 3.47 (tout appareil sous iOS 14 peut passer en iOS 15).
  IOS_DEPLOYMENT_TARGET: '15.0'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Toolchain diagnostics
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          pod --version
          flutter --version
          dart --version

      - name: Recreate iOS platform files
        # Partage avec testflight.yml (completion du projet, cible iOS).
        run: |
          bash scripts/prepare_ios.sh "${IOS_DEPLOYMENT_TARGET}"
          # Build de test non signe (installation par SideStore/AltStore).
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig

      - name: Validate storyboards
        # xcodebuild remonte "Command CompileStoryboard failed with a nonzero
        # exit code" sans le message d'ibtool (il part dans le xcresult). On
        # appelle ibtool directement pour obtenir le diagnostic lisible.
        run: |
          IBTOOL="$(xcode-select -p)/usr/bin/ibtool"
          for sb in ios/Runner/Base.lproj/*.storyboard; do
            echo "=== $sb ==="
            "$IBTOOL" --errors --warnings --notices \
              --minimum-deployment-target "${IOS_DEPLOYMENT_TARGET}" \
              --target-device iphone --target-device ipad \
              --output-format human-readable-text \
              --compile "$(mktemp -d)/$(basename "$sb")c" "$sb" \
              || echo ">>> ibtool a echoue sur $sb"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        # Bloque uniquement sur les vraies erreurs de compilation Dart :
        # les infos et warnings de style ne doivent pas casser la release.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        # Le build ne verifiait jusqu'ici que la compilation : des correctifs
        # ont ete livres comme fonctionnels sans l'etre.
        run: flutter test --reporter expanded

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons || true

      - name: Build iOS App
        env:
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
          CODE_SIGN_IDENTITY: ''
        run: |
          set -o pipefail
          # --verbose : sans lui, l'outil Flutter resume l'echec xcodebuild en une
          # ligne ("Command X failed with a nonzero exit code") et masque le
          # message reel du compilateur / d'ibtool. La sortie va dans le fichier
          # (recuperable via l'artefact build-diagnostics) et non dans la console,
          # qui resterait illisible avec ~12000 lignes.
          flutter build ios --release --no-codesign --verbose > build_output.txt 2>&1 || {
            echo "=== FIRST ERROR LINES ==="
            grep -n -i -E 'error:|\*\* BUILD FAILED|Encountered error' build_output.txt | head -n 50
            echo "=== IBTOOL / STORYBOARD ==="
            grep -n -i -E 'ibtool|storyboard|CompileStoryboard' build_output.txt | head -n 40
            echo "=== LAST 200 LINES ==="
            tail -n 200 build_output.txt
            exit 1
          }

      - name: Read app version
        id: version
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "app_version=${V}" >> "$GITHUB_OUTPUT"

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r "PetitPas_v${{ steps.version.outputs.app_version }}.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PetitPas-v${{ steps.version.outputs.app_version }}-iOS-IPA
          path: PetitPas_v${{ steps.version.outputs.app_version }}.ipa

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          if-no-files-found: warn
          path: |
            build_output.txt
            pubspec.lock
            ios/Podfile.lock
