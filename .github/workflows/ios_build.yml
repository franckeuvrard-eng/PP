name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Recreate iOS platform files
        run: |
          mv ios/Runner/Info.plist Info.plist.bak
          flutter create --project-name=petitpas --platforms=ios .
          mv Info.plist.bak ios/Runner/Info.plist
          echo "platform :ios, '14.0'" > ios/Podfile
          echo "ENV['COCOAPODS_DISABLE_STATS'] = 'true'" >> ios/Podfile
          echo "project 'Runner', {'Debug' => :debug, 'Profile' => :release, 'Release' => :release}" >> ios/Podfile
          echo "def flutter_root" >> ios/Podfile
          echo "  generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)" >> ios/Podfile
          echo "  unless File.exist?(generated_xcode_build_settings_path)" >> ios/Podfile
          echo "    raise \"generated_xcode_build_settings_path must exist.\"" >> ios/Podfile
          echo "  end" >> ios/Podfile
          echo "  File.foreach(generated_xcode_build_settings_path) do |line|" >> ios/Podfile
          echo "    matches = line.match(/FLUTTER_ROOT\=(.*)/)" >> ios/Podfile
          echo "    return matches[1].strip if matches" >> ios/Podfile
          echo "  end" >> ios/Podfile
          echo "  raise \"FLUTTER_ROOT not found in generated_xcode_build_settings_path\"" >> ios/Podfile
          echo "end" >> ios/Podfile
          echo "require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)" >> ios/Podfile
          echo "flutter_ios_podfile_setup" >> ios/Podfile
          echo "target 'Runner' do" >> ios/Podfile
          echo "  use_frameworks!" >> ios/Podfile
          echo "  use_modular_headers!" >> ios/Podfile
          echo "  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))" >> ios/Podfile
          echo "end" >> ios/Podfile
          echo "post_install do |installer|" >> ios/Podfile
          echo "  installer.pods_project.targets.each do |target|" >> ios/Podfile
          echo "    flutter_additional_ios_build_settings(target)" >> ios/Podfile
          echo "    target.build_configurations.each do |config|" >> ios/Podfile
          echo "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'" >> ios/Podfile
          echo "    end" >> ios/Podfile
          echo "  end" >> ios/Podfile
          echo "end" >> ios/Podfile
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=0000000000" >> ios/Flutter/Release.xcconfig
          rm -rf test

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons || true

      - name: Build iOS App
        env:
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
          CODE_SIGN_IDENTITY: ''
        run: flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r PetitPas_v1.3.0.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetitPas-v1.3.0-iOS-IPA
          path: PetitPas_v1.3.0.ipa
