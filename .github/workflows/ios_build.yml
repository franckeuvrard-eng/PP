name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Recreate iOS platform files
        run: |
          echo "=== Start Recreate ===" > recreate_log.txt
          mv ios/Runner/Info.plist Info.plist.bak >> recreate_log.txt 2>&1 || echo "mv Info.plist failed" >> recreate_log.txt
          flutter create --platforms=ios . >> recreate_log.txt 2>&1 || echo "flutter create failed" >> recreate_log.txt
          mv Info.plist.bak ios/Runner/Info.plist >> recreate_log.txt 2>&1 || echo "restore Info.plist failed" >> recreate_log.txt
          echo "=== End Recreate ===" >> recreate_log.txt

      - name: Upload Recreate Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recreate-log
          path: recreate_log.txt

      - name: Push Recreate Log to Repo
        if: always()
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add recreate_log.txt
          git commit -m "Add recreate debug log [skip ci]" || true
          git push origin main || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetitPas-iOS-IPA
          path: Runner.ipa
