name: Build Windows App

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-windows:
    # VS 2022 et non windows-latest (VS 2026) : local_auth_windows compile
    # encore avec l'option /await, que VS 2026 refuse desormais.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Recreate Windows platform files
        # Le dossier plateforme n'est pas versionne (comme pour iOS et macOS).
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter create --project-name=petitpas --platforms=windows .
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: App icon
        # Remplace l'icone Flutter par celle de l'application (pubspec.yaml,
        # section flutter_launcher_icons > windows).
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build Windows App
        run: flutter build windows --release

      - name: Bundle sqlite3.dll
        # sqflite_common_ffi charge sqlite3.dll au demarrage ; Windows ne la
        # fournit pas (contrairement a macOS). DLL officielle sqlite.org,
        # epinglee par empreinte SHA-256.
        shell: pwsh
        run: |
          $url = 'https://www.sqlite.org/2025/sqlite-dll-win-x64-3500400.zip'
          $expected = '56b8751cdbf6dcd8ac9a35508039e456692a402bc5ddf576c2b0eddb0fed8536'
          Invoke-WebRequest -Uri $url -OutFile sqlite.zip
          $actual = (Get-FileHash sqlite.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Empreinte sqlite inattendue : $actual" }
          Expand-Archive sqlite.zip -DestinationPath sqlite
          Copy-Item sqlite\sqlite3.dll build\windows\x64\runner\Release\
          Get-ChildItem build\windows\x64\runner\Release\sqlite3.dll

      - name: Read app version
        id: version
        shell: bash
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "app_version=${V}" >> "$GITHUB_OUTPUT"

      - name: Package
        # Le dossier Release contient l'.exe ET les DLL / donnees : il faut
        # tout livrer ensemble, l'.exe seul ne demarre pas. Version portable,
        # en plus de l'installateur.
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "PetitPas_v${{ steps.version.outputs.app_version }}_Windows.zip"

      - name: Build installer
        # Inno Setup 6 est preinstalle sur l'image windows-2022 (l'installer
        # nous-memes restait bloque) : installateur classique, raccourcis et
        # desinstallation depuis les Parametres Windows. Script :
        # windows_config/petitpas.iss.
        shell: pwsh
        timeout-minutes: 10
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 (ISCC.exe) absent de l'image du runner" }
          $release = Resolve-Path build\windows\x64\runner\Release
          $icon = Resolve-Path windows\runner\resources\app_icon.ico
          & $iscc "/DAppVersion=${{ steps.version.outputs.app_version }}" "/DSourceDir=$release" "/DIconFile=$icon" "/O$PWD" windows_config\petitpas.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a echoue ($LASTEXITCODE)" }
          Get-ChildItem PetitPas_*_Setup.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PetitPas-v${{ steps.version.outputs.app_version }}-Windows
          path: |
            PetitPas_v${{ steps.version.outputs.app_version }}_Windows_Setup.exe
            PetitPas_v${{ steps.version.outputs.app_version }}_Windows.zip
