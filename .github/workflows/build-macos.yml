name: Build macOS App

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Recreate macOS platform files
        # Comme pour iOS, le dossier plateforme n'est pas versionne : on le
        # regenere, puis on applique la configuration propre a l'application
        # (droits reseau/micro, taille minimale de fenetre, textes de permission).
        run: |
          flutter config --enable-macos-desktop
          flutter create --project-name=petitpas --platforms=macos .
          rm -f test/widget_test.dart
          cp macos_config/DebugProfile.entitlements macos/Runner/DebugProfile.entitlements
          cp macos_config/Release.entitlements macos/Runner/Release.entitlements
          # Identifiant definitif de l'app (le meme que sur iOS).
          sed -i '' 's/^PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = fr.franckeuvrard.apetitspas/' macos/Runner/Configs/AppInfo.xcconfig
          grep -n PRODUCT_BUNDLE_IDENTIFIER macos/Runner/Configs/AppInfo.xcconfig
          # Pas de droits iCloud ici : sur Mac, une app non signee par Apple qui
          # les declare refuse de demarrer. Ils sont ajoutes par testflight.yml.
          # Taille minimale de fenetre : en dessous, la barre laterale ecrase
          # le contenu.
          perl -0pi -e 's/super\.awakeFromNib\(\)/self.minSize = NSSize(width: 900, height: 640)\n    super.awakeFromNib()/' macos/Runner/MainFlutterWindow.swift
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Notes vocales sur les observations.'" macos/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Synchronisation avec l application sur iPhone/iPad.'" macos/Runner/Info.plist
          # Service Bonjour de decouverte automatique (cf. sync_discovery.dart).
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" -c "Add :NSBonjourServices:0 string '_petitpas._tcp'" macos/Runner/Info.plist
          grep -n "minSize" macos/Runner/MainFlutterWindow.swift
          # Cible macOS : celle du template Flutter (12.0 depuis Flutter 3.4x),
          # au-dessus du minimum du plugin record (10.15).
          grep -n 'platform :osx' macos/Podfile || true
          grep -m1 'MACOSX_DEPLOYMENT_TARGET' macos/Runner.xcodeproj/project.pbxproj

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build macOS App
        run: |
          set -o pipefail
          flutter build macos --release --verbose > build_output.txt 2>&1 || {
            grep -n -i -E 'error:|\*\* BUILD FAILED|Encountered error' build_output.txt | head -n 50
            tail -n 200 build_output.txt
            exit 1
          }

      - name: Read app version
        id: version
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "app_version=${V}" >> "$GITHUB_OUTPUT"

      - name: Package .app
        # ditto conserve les attributs macOS (liens symboliques des frameworks)
        # que `zip` abimerait.
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/PetitPas_v${{ steps.version.outputs.app_version }}_macOS.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PetitPas-v${{ steps.version.outputs.app_version }}-macOS
          path: PetitPas_v${{ steps.version.outputs.app_version }}_macOS.zip

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-macos
          if-no-files-found: warn
          path: |
            build_output.txt
            pubspec.lock
