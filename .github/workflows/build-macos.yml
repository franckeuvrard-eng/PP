name: Build macOS App

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Recreate macOS platform files
        # Dossier macos/ non versionne : regenere et configure par le script
        # partage avec testflight.yml. Pas de droits iCloud ici : sur Mac, une
        # app non signee par Apple qui les declare refuse de demarrer.
        run: bash scripts/prepare_macos.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build macOS App
        run: |
          set -o pipefail
          flutter build macos --release --verbose > build_output.txt 2>&1 || {
            grep -n -i -E 'error:|\*\* BUILD FAILED|Encountered error' build_output.txt | head -n 50
            tail -n 200 build_output.txt
            exit 1
          }

      - name: Read app version
        id: version
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "app_version=${V}" >> "$GITHUB_OUTPUT"

      - name: Package .app
        # ditto conserve les attributs macOS (liens symboliques des frameworks)
        # que `zip` abimerait.
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/PetitPas_v${{ steps.version.outputs.app_version }}_macOS.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PetitPas-v${{ steps.version.outputs.app_version }}-macOS
          path: PetitPas_v${{ steps.version.outputs.app_version }}_macOS.zip

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-macos
          if-no-files-found: warn
          path: |
            build_output.txt
            pubspec.lock
