name: Build All Platforms

# Lance iOS, macOS et Windows en parallele a chaque push (ou a la main :
# Actions > Build All Platforms > Run workflow). Seul point d'entree sur push :
# les workflows par plateforme ne se declenchent plus seuls, pour ne pas
# construire deux fois. Chaque plateforme publie son propre artefact (IPA,
# .zip macOS, .zip Windows).
on:
  push:
    branches: [ main, master, claude/mac-app-mobile-communication-ftwnjw ]
    paths-ignore: [ 'web_prototype/**' ]
  workflow_dispatch:

jobs:
  ios:
    uses: ./.github/workflows/ios_build.yml
  macos:
    uses: ./.github/workflows/build-macos.yml
  windows:
    uses: ./.github/workflows/build-windows.yml
