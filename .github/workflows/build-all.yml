name: Build All Platforms

# Lance iOS, macOS et Windows en parallele : Actions > Build All Platforms >
# Run workflow, en choisissant la branche. Chaque plateforme publie son propre
# artefact (IPA, .zip macOS, .zip Windows).
on:
  workflow_dispatch:

jobs:
  ios:
    uses: ./.github/workflows/ios_build.yml
  macos:
    uses: ./.github/workflows/build-macos.yml
  windows:
    uses: ./.github/workflows/build-windows.yml
